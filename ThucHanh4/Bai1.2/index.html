<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Quản lý sinh viên</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<h2>Quản lý sinh viên</h2>

<input type="text" id="name" placeholder="Họ tên">
<input type="number" id="score" placeholder="Điểm">
<button id="addBtn">Thêm</button>

<br><br>

<input type="text" id="search" placeholder="Tìm kiếm tên">

<select id="filterRank">
<option value="all">Tất cả</option>
<option value="Giỏi">Giỏi</option>
<option value="Khá">Khá</option>
<option value="Trung bình">Trung bình</option>
<option value="Yếu">Yếu</option>
</select>

<table>

<thead>
<tr>
<th>STT</th>
<th>Họ tên</th>
<th id="scoreHeader">Điểm</th>
<th>Xếp loại</th>
<th>Xóa</th>
</tr>
</thead>

<tbody id="tableBody">
</tbody>

</table>

<p id="noResult" style="display:none">Không có kết quả</p>

<script src="script.js"></script>

</body>
</html>
